];}

if (!window.orgColor) {
window.Story = [
    {
        id: 1,//流水號
        title: "故事A",//標題，顯示在tab跟title上
        cover: "./img/Story_1/cover.png",//封面url
        Intro: "故事A簡介",//簡介
        //標籤們
        Rating: "輔導級 (PG-15)",//分級，填入rating.title
        Archive_Warning: "作品內容的地雷與風險提示",//作品內容的地雷與風險提示

        Language: "繁體中文",//語言，複數會以","分割"

        ]
    },
    {
        id: 2,
        title: "10年後，我回到了睽違已久的老家，那裏有我的家人等著我......",
        cover: "https://images.plurk.com/5UTk6AHN3ZVVFfVLUSO9Px.jpg",
        Intro: "故事B簡介",
        Rating: "限制級 (R-18)",

                cover: "./img/Story_2/Chapter_1/cover.png",

                End: true,

                    { url: "./img/Story_2/Chapter_1/0.png" },
                    { url: "./img/Story_2/Chapter_1/1.png" }

];}


//直接用區域變數 Story[0].id，並掛載到全域
window.activeStoryId = window.Story[0].id;
window.storyStates = {}; // 掛載到全域

Story.forEach(s => {
    storyStates[s.id] = {
        mode: 'home',
        chapterNum: s.Chapter[0] ? s.Chapter[0].num : 0,
        pageNum: 0,
        unlocked: false
    };
    const saved = localStorage.getItem(`comic_history_story_${s.id}`);// 嘗試讀取歷史觀看紀錄
    if (saved) {
        try {
            const parsed = JSON.parse(saved);
            storyStates[s.id].mode = parsed.mode;
            storyStates[s.id].chapterNum = parsed.chapterNum;
            storyStates[s.id].pageNum = parsed.pageNum;
        } catch(e) {}
    }
});
renderTabs();
renderActiveContent();

})();
</script>
